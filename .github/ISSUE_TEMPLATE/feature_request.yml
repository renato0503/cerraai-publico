name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria para o Cerra.AI
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Descreva a necessidade antes da solução. Não inclua dados pessoais ou documentos internos.
  - type: textarea
    id: problema
    attributes:
      label: Qual problema ou necessidade você quer resolver?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Opcional. Outras formas de resolver o mesmo problema.
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que não incluí dados pessoais, documentos reais ou segredos nesta issue.
          required: true
